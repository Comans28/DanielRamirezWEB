<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyTrack - Control de Finanzas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>MoneyTrack</h1>
    <p>Titular: <strong id="lbl-titular">-</strong></p>
  </header>

  <main class="container">
    
    <!-- Resumen / Estadísticas -->
    <section class="tarjetas-resumen">
      <div class="tarjeta saldo">
        <h3>Saldo Actual</h3>
        <p id="val-saldo">0,00 €</p>
      </div>
      <div class="tarjeta ingresos">
        <h3>Total Ingresos</h3>
        <p id="val-ingresos">0,00 €</p>
      </div>
      <div class="tarjeta gastos">
        <h3>Total Gastos</h3>
        <p id="val-gastos">0,00 €</p>
      </div>
      <div class="tarjeta top-gasto">
        <h3>Categoría con Más Gasto</h3>
        <p id="val-top-categoria">-</p>
      </div>
    </section>

    <!-- NIVEL 06: Formulario para Añadir Movimiento -->
    <section class="seccion-formulario">
      <h2>Añadir Nuevo Movimiento</h2>
      <form id="form-movimiento">
        <div class="campo">
          <label for="concepto">Concepto:</label>
          <input type="text" id="concepto" placeholder="Ej. Compra supermercado" required>
        </div>

        <div class="campo">
          <label for="importe">Importe (€) (+ para ingreso, - para gasto):</label>
          <input type="number" id="importe" step="0.01" placeholder="Ej. -45.50 o 1200" required>
        </div>

        <div class="campo">
          <label for="categoria">Categoría:</label>
          <select id="categoria" required>
            <option value="">Selecciona una categoría</option>
            <option value="Nómina">Nómina</option>
            <option value="Comida">Comida</option>
            <option value="Ocio">Ocio</option>
            <option value="Transporte">Transporte</option>
            <option value="Hogar">Hogar</option>
            <option value="Otros">Otros</option>
          </select>
        </div>

        <div class="campo">
          <label for="fecha">Fecha:</label>
          <input type="date" id="fecha" required>
        </div>

        <button type="submit" id="btn-anadir">Añadir Movimiento</button>
      </form>
    </section>

    <!-- NIVEL 04: Filtro y Tabla de Movimientos -->
    <section class="seccion-tabla">
      <div class="cabecera-tabla">
        <h2>Historial de Movimientos</h2>
        <div class="filtro-container">
          <label for="filtro-categoria">Filtrar por categoría:</label>
          <select id="filtro-categoria">
            <option value="TODAS">Todas las categorías</option>
            <option value="Nómina">Nómina</option>
            <option value="Comida">Comida</option>
            <option value="Ocio">Ocio</option>
            <option value="Transporte">Transporte</option>
            <option value="Hogar">Hogar</option>
            <option value="Otros">Otros</option>
          </select>
        </div>
      </div>

      <table id="tabla-movimientos">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Concepto</th>
            <th>Categoría</th>
            <th>Importe</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody-movimientos">
          <!-- Las filas se insertan dinámicamente -->
        </tbody>
      </table>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
